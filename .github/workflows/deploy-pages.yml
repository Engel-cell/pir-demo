# PIR Demo — 仅发布已审计的静态产物到 GitHub Pages
#
# 设计约束（对应 PIR-GITHUB-DEMO-002 Phase 3）：
#   · 只发布静态演示产物（site/），不构建、不安装依赖、不启动任何后端
#   · 不读取任何 secrets（工作流中不存在 secrets.* 引用）
#   · 最小权限：contents:read + pages:write + id-token:write
#   · 仅 GitHub 官方 Actions，版本锚定到当前最新 major：
#     actions/checkout@v7 · actions/configure-pages@v6 ·
#     actions/upload-pages-artifact@v5 · actions/deploy-pages@v5
#     （首版曾用 v4/v5/v3/v4，实测 deploy-pages@v4 取不到 upload-pages-artifact@v3 的产物，
#       且这些旧版本运行在已弃用的 Node 20 上——见 10-release-report.md 首次失败记录）
#   · 仅手动触发（workflow_dispatch），不会因 push 自动发布
#
# 为什么不在 CI 里跑 npm ci + build:demo：
#   发布仓库只允许包含已审计的构建产物，禁止上传 PIR 源码（见 DEMO-001 授权边界）。
#   构建在本地执行 `npm run build:demo --workspace @pir/web`，产物经 31 项浏览器审计
#   与敏感信息扫描后上传；CI 侧只做"产物白名单校验 + 部署"，避免构建漂移。
name: Deploy PIR demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify publish whitelist (no source, no maps, no stray files)
        run: |
          set -euo pipefail
          test -f site/index.html
          test -d site/assets
          echo "--- files to be published ---"
          find site -type f | sort
          echo "--- assertions ---"
          test "$(find site -name '*.map' | wc -l)" -eq 0
          test "$(find site -maxdepth 1 -type f ! -name 'index.html' | wc -l)" -eq 0
          test "$(find site -type f ! -name '*.js' ! -name '*.css' ! -name '*.html' | wc -l)" -eq 0
          grep -q '/pir-demo/assets/' site/index.html
          echo "whitelist OK"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact (site/ only)
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
